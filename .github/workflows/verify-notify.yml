# Negative check of the alert pipeline's security: posts the RETIRED public
# secret (the one that used to ship in the page HTML) to notify-deal and
# asserts it gets a 401. If this workflow fails, the old secret still works
# and the rotation needs investigating.
#
# The positive check (does a real alert reach the phone?) lives in
# verify-trigger.yml, which fires the actual DB trigger path.

name: Verify notify-deal (retired secret must be rejected)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST the retired secret — expect 401
        run: |
          CODE=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            "https://ufjkeqmxwuyhbqyugcgg.supabase.co/functions/v1/notify-deal" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmamtlcW14d3V5aGJxeXVnY2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDI2MDksImV4cCI6MjA5MzkxODYwOX0.godgU_jeprCqSzqe0ji_ZA_hwvPF2s7BmzQyAB-c_xE" \
            -d '{"event":"new_deal","secret":"gl-notify-2026-abc123","data":{"company":"RETIRED SECRET PROBE — should be rejected","name":"security check"}}')
          cat resp.txt; echo; echo "HTTP $CODE"
          if [ "$CODE" = "401" ]; then
            echo "✓ retired public secret correctly rejected"
          else
            echo "✗ the retired secret still works (HTTP $CODE) — rotation failed or fallback still active"
            exit 1
          fi
