# One-button live check of the WhatsApp/email alert pipeline (notify-deal).
#
# POSTs a clearly-labeled test event to the notify-deal edge function exactly
# the way the CRM does, and prints the function's verdict — including whether
# CallMeBot actually accepted the WhatsApp send. Exists because the sandboxed
# assistant cannot reach *.supabase.co directly, but GitHub runners can.
#
# The two values inline here are NOT secrets: both ship in the public site
# HTML (the anon key by design; GL_NOTIFY_SECRET at index.html:4757 — a soft
# gate, flagged for future hardening).

name: Verify notify-deal

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send a labeled test alert through notify-deal
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X POST \
            "https://ufjkeqmxwuyhbqyugcgg.supabase.co/functions/v1/notify-deal" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmamtlcW14d3V5aGJxeXVnY2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDI2MDksImV4cCI6MjA5MzkxODYwOX0.godgU_jeprCqSzqe0ji_ZA_hwvPF2s7BmzQyAB-c_xE" \
            -d '{"event":"new_deal","secret":"gl-notify-2026-abc123","data":{"company":"CRM VERIFICATION TEST — ignore me","name":"Automated pipeline check"}}'
