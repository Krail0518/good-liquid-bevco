# Authorization drift gate — GL-DRIFT-01.
#
# Migration-only review cannot prove production state. Three separate holes in
# this codebase were invisible to it and were found only by querying the live
# catalog:
#
#   2026-05-18  fourteen permissive `anon` policies applied by hand in the
#               dashboard, present in no migration — the entire CRM readable
#               and deletable by anyone on the internet.
#   2026-08-28  `authed all` / `anon read` / `public read` on thirteen tables,
#               likewise in no migration.
#   2026-08-29  anon holding INSERT/UPDATE/DELETE/TRUNCATE on 73 tables.
#
# So this diffs the live catalog against a committed baseline and fails on any
# unreviewed change. Adding a dashboard policy or an EXECUTE grant now makes CI
# red, which is the acceptance criterion the independent audit asked for.
#
# The check runs on pull requests too, so a migration that changes
# authorization without its baseline update cannot merge quietly.

name: DB Drift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 9 * * *'   # daily; catches drift introduced outside the repo
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Regenerate the baseline from production and commit it'
        type: boolean
        default: false

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # only used by the update_baseline path
  pull-requests: read    # the Dependabot gate below reads the PR file list

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the update path can commit back to the branch.
          ref: ${{ github.head_ref || github.ref_name }}

      # Dependabot pull requests run in a restricted context and cannot read
      # Actions secrets, so SUPABASE_ACCESS_TOKEN arrives empty and this check
      # can only fail. `drift` is a REQUIRED status check, so that made every
      # Dependabot PR permanently unmergeable — four of them were already stuck
      # when this was found.
      #
      # A permanently red required check is worse than the check not existing:
      # it teaches everyone that red is normal. That is the same failure this
      # repository's whole test strategy is built to avoid.
      #
      # Skipping is safe ONLY because such a PR cannot reach authorization at
      # all — the github-actions ecosystem updates workflow files and nothing
      # else. That is VERIFIED here, not assumed: if a Dependabot PR ever
      # touches a file outside .github/, this fails loudly instead of skipping.
      - name: Decide whether drift can run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUM="${{ github.event.pull_request.number }}"
          if [ -z "$NUM" ]; then
            echo "Dependabot actor outside a pull request — running drift normally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/${{ github.repository }}/pulls/$NUM/files" --paginate --jq '.[].filename')
          echo "Files in this Dependabot PR:"
          echo "$FILES" | sed 's/^/  /'
          OUTSIDE=$(printf '%s\n' "$FILES" | grep -v '^\.github/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo ""
            echo "::error::A Dependabot PR touched files outside .github/, so it cannot be"
            echo "::error::assumed unable to affect authorization. Drift must run, but the"
            echo "::error::token is unavailable in this context. Review manually:"
            printf '%s\n' "$OUTSIDE" | sed 's/^/  /'
            exit 1
          fi
          echo ""
          echo "Dependabot PR touches only .github/ — it cannot change any policy,"
          echo "grant, RLS flag or bucket. Skipping the live drift query, which"
          echo "cannot run without repository secrets in this context."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Check for authorization drift
        if: ${{ github.event.inputs.update_baseline != 'true' && steps.gate.outputs.run != 'false' }}
        env:
          # Read-only use: the script runs one SELECT-only snapshot query.
          # Passed as a header from the runner environment, never echoed.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/check-db-drift.sh

      - name: Regenerate the baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/check-db-drift.sh --update

      # NOTE: this commit is made with GITHUB_TOKEN, and GitHub deliberately
      # does NOT trigger workflows from it (the recursion guard). So the
      # baseline commit will not re-run this check by itself — push any
      # human-authored commit, or re-dispatch, to see it go green.
      - name: Commit the regenerated baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          # `git diff` does not see untracked files, so stage first and then
          # test the index. Without this the very first run — where the
          # baseline is a new file — reports "nothing to commit" and silently
          # produces no baseline at all.
          git add docs/database/authorization-baseline.txt
          if git diff --cached --quiet -- docs/database/authorization-baseline.txt; then
            echo "Baseline already matches production — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/database/authorization-baseline.txt
          git commit \
            -m "chore: regenerate the authorization baseline from production" \
            -m "Ran scripts/check-db-drift.sh --update. Review this diff: every line is a policy, RLS flag, table grant, function ACL or bucket that changed in production. Anything here that does not correspond to a reviewed migration is dashboard drift."
          git push
