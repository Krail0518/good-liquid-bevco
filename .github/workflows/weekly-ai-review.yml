# Weekly deep review — standard §14 and Setup Instruction #1.
#
# STATUS: connected. The review calls an independent reviewer and files each
# finding as an issue carrying the six fields Setup Instruction #1 requires.
#
# The reviewer is OpenAI, not Anthropic, on purpose: AGENTS.md divides the work
# so that Claude implements and ChatGPT/Codex reviews INDEPENDENTLY. A reviewer
# from the same family as the implementer is the same model marking its own
# homework.
#
# Requires OPENAI_API_KEY (preferred) or ANTHROPIC_API_KEY. Without either
# the job FAILS rather than
# skipping — a job that passes while doing nothing is worse than no job,
# because it reads as coverage. Optional repo variable AI_REVIEW_MODEL picks
# the model (default gpt-4o).
#
# ── The timezone problem, and why the cron looks like this ───────────────────
# GitHub Actions cron is UTC and has no DST handling. A single `0 12 * * 2` is
# 08:00 America/New_York in summer and 07:00 in winter, so the "Tuesday 8am"
# review silently drifts an hour for roughly five months of the year. Setup
# Instruction #1 explicitly requires configuring the intended timezone rather
# than assuming UTC.
#
# There is no cron timezone field, so the standard workaround is to fire at
# BOTH candidate hours and let the job decide: 11:00 UTC is 08:00 EDT, 12:00
# UTC is 08:00 EST. Exactly one of the two matches 08:00 New York on any given
# Tuesday; the other exits immediately. That costs one no-op run a week and is
# correct year round.

name: Weekly AI Review

on:
  schedule:
    - cron: '0 11,12 * * 2'   # 08:00 America/New_York, EDT and EST respectively
  workflow_dispatch:

concurrency:
  group: weekly-ai-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fire only on the run that is genuinely 08:00 in New York. A manual
      # dispatch always proceeds — the point of dispatch is to run it now.
      - name: Is it 08:00 in New York?
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding regardless of the hour."
            exit 0
          fi
          NY_HOUR=$(TZ=America/New_York date +%H)
          echo "New York hour is $NY_HOUR"
          if [ "$NY_HOUR" = "08" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Not 08:00 in New York — this is the other DST candidate run. Exiting."
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.proceed == 'true'
        with:
          fetch-depth: 0   # the review needs history to diff since the last one

      # Collect what Setup Instruction #1 asks the review to consider. This part
      # is real and useful on its own: it produces the input a reviewer needs.
      - name: Gather the review input
        if: steps.when.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p review-input
          SINCE=$(git log -1 --format=%cI --before="7 days ago" 2>/dev/null || echo "")
          echo "## Changes since the last review" > review-input/summary.md
          git log --since="7 days ago" --oneline >> review-input/summary.md || true
          echo >> review-input/summary.md
          echo "## Migrations touched" >> review-input/summary.md
          git log --since="7 days ago" --name-only --format="" -- supabase/migrations/ | sort -u >> review-input/summary.md || true
          echo >> review-input/summary.md
          echo "## Open pull requests" >> review-input/summary.md
          gh pr list --state open --limit 50 >> review-input/summary.md || true
          echo >> review-input/summary.md
          echo "## Technical debt register" >> review-input/summary.md
          sed -n '1,60p' docs/plans/technical-debt.md >> review-input/summary.md || true
          cat review-input/summary.md

      - name: Upload the review input
        if: steps.when.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-input
          path: review-input/
          retention-days: 30

      - name: Set up Node
        if: steps.when.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The reviewer. A missing key, an API error, or output that cannot be
      # parsed all FAIL here rather than reporting "no findings" -- the whole
      # point of this job is that a green check asserts a review happened.
      - name: Run the deep review
        if: steps.when.outputs.proceed == 'true'
        env:
          # OpenAI is preferred: AGENTS.md wants a reviewer that did not write
          # the code. ANTHROPIC_API_KEY is a working fallback and the run says
          # so, loudly, because it is a real downgrade in independence.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: node scripts/ai-review.mjs review-input/summary.md review-output

      # Findings become issues shaped like the ai-review-finding template, so
      # they carry the six fields Setup Instruction #1 requires. A finding id
      # that already has an open issue gets a "still present" comment instead
      # of a duplicate.
      - name: File the findings
        if: steps.when.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai-review-file-issues.mjs review-output/findings.json

      - name: Upload the findings
        if: steps.when.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-findings
          path: review-output/
          retention-days: 90

      # Surface the verdict in the job summary so the outcome is visible
      # without opening the log.
      - name: Summarise
        if: steps.when.outputs.proceed == 'true'
        run: |
          n=$(node -e "console.log(require('./review-output/findings.json').findings.length)")
          b=$(node -e "console.log(require('./review-output/findings.json').findings.filter(f=>f.release_blocking).length)")
          {
            echo "## Weekly deep review"
            echo
            echo "- findings: **$n**"
            echo "- release-blocking: **$b**"
            echo
            if [ "$b" != "0" ]; then
              echo "BLOCKER/HIGH findings block release until fixed or explicitly accepted (§8 step 7)."
            elif [ "$n" = "0" ]; then
              echo "The reviewer returned an empty list. That is a real result, not a skip."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
