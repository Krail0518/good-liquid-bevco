# Live check of the trigger-driven WhatsApp alert path: inserts a clearly
# labeled test deal (which fires the on_deal_insert trigger → notify-deal →
# CallMeBot), then deletes it. The phone buzzing is the readout. Runs the SQL
# through the Supabase Management API because the assistant's sandbox cannot
# reach supabase.co directly.

name: Verify trigger alerts

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ufjkeqmxwuyhbqyugcgg
    steps:
      - name: Insert and remove a labeled test deal (fires the alert trigger)
        run: |
          run_sql () {
            jq -n --arg q "$1" '{query: $q}' > payload.json
            curl -sS -f -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @payload.json
            echo
          }
          run_sql "insert into deals (name, client_name, stage, service) values ('TRIGGER TEST — ignore me', 'CRM verification', 'Prospecting', 'automated check') returning id, name;"
          sleep 5
          run_sql "delete from deals where name = 'TRIGGER TEST — ignore me' returning id;"
          echo "test deal inserted and removed — the WhatsApp should have fired"
