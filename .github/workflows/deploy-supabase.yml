name: Deploy Supabase

# Manually triggered from the Actions tab (works from a phone browser).
# Requires a repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token). Optionally SUPABASE_DB_PASSWORD to also push migrations.
on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy edge functions'
        type: boolean
        default: true
      push_migrations:
        description: 'Also apply DB migrations (needs SUPABASE_DB_PASSWORD secret)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ufjkeqmxwuyhbqyugcgg
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy edge functions
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        if: ${{ inputs.push_migrations }}
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
