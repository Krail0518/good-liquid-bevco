# Smoke test — critical-path regression guard for the CRM.
#
# Runs the headless-browser checks in tests/smoke.test.cjs on every push to
# main and on every pull request. If a change breaks a critical button
# (login shell, New Invoice, nav, modals) this job goes red and blocks the
# merge — catching the "you keep breaking things when we add features" class
# of bug BEFORE it reaches production.
#
# It does NOT touch Supabase or any real credentials: the test serves the
# static site locally and forces a fake admin session in the browser.
#
# Playwright is installed into a temp dir (NOT the repo) so it can never add a
# package.json/node_modules that would interfere with Vercel's static deploy.

name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (into a temp dir, not the repo)
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.0 >/dev/null 2>&1
          # Download the Chromium browser Playwright will drive.
          npx playwright install chromium

      # Pure-logic unit tests for the mail pipeline (header encoding, body
      # extraction, quoted-thread trimming, entity decoding). No browser needed,
      # so run them first — they fail fastest and pinpoint most precisely.
      - name: Run email-text unit tests
        run: node tests/email-text.test.mjs

      - name: Run OAuth error-mapping unit tests
        run: node tests/oauth-errors.test.mjs

      # Stored-XSS guard for the calendar day panel. cal_events titles and notes
      # originate in the PUBLIC tour-booking form, so this asserts they render as
      # inert text rather than markup. Fails against the pre-fix code.
      - name: Run calendar XSS regression test
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/calendar-xss.test.cjs
      # The QuickBooks OAuth callback must verify the state it was handed.
      - name: Run QBO OAuth state tests
        run: node tests/qbo-oauth-state.test.cjs
      # The public pay endpoint must not allow invoice enumeration.
      - name: Run stripe-checkout authorization tests
        run: node tests/stripe-checkout-auth.test.cjs
      # app_settings migration — the one-shot localStorage -> DB move must never
      # delete the local copy before the database write lands, and a seeded empty
      # default must not mask a real local value. No browser needed.
      - name: Run app_settings migration tests
        run: node tests/app-settings-migration.test.cjs
      # Role change and deactivation must not report success when the database
      # did not change. Guards both the ReferenceError that stopped the write
      # running at all, and the missing rows-affected check underneath it.
      - name: Run user-admin write tests
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/user-admin-writes.test.cjs
      # Marking an invoice paid must not report success when the database did
      # not change. Extracts glPersistInvoiceStatus from index.html and drives
      # it against a fake PostgREST, so no browser is needed.
      - name: Run invoice mark-paid write tests
        run: node tests/invoice-paid-writes.test.cjs

      # A record the database refused to create must not appear in the UI as
      # though it exists. No browser needed.
      - name: Run checked-insert tests
        run: node tests/checked-inserts.test.cjs

      # A delete the database refused must not purge the local cache or write
      # an audit entry saying it happened. No browser needed.
      - name: Run checked-delete tests
        run: node tests/checked-deletes.test.cjs
      # Admin tools must not destroy the only copy of data, or report a
      # change they did not make. No browser needed.
      - name: Run admin-tools data-loss tests
        run: node tests/admin-tools-data-loss.test.cjs
      # Declared JWT state, webhook replay window, deactivated super-user.
      - name: Run edge-function hardening tests
        run: node tests/edge-function-hardening.test.cjs
      # The suite must not score absence as success, and the pageerror filter
      # must not discard real crashes. Guards the guards. No browser needed.
      - name: Run test-integrity tests
        run: node tests/test-integrity.test.cjs
      # A CIP save the database rejected must stay visible to the operator,
      # and nothing may query the deprecated cip_logs. No browser needed.
      - name: Run CIP system-of-record tests
        run: node tests/cip-system-of-record.test.cjs
      # compliance-photos is private, so nothing may persist a URL for it —
      # a public URL 400s and a signed one expires. No browser needed.
      - name: Run compliance-photos storage tests
        run: node tests/compliance-photos.test.cjs
      # A credential committed to the repo is public forever. No browser needed.
      - name: Run committed-secret tests
        run: node tests/committed-secrets.test.cjs
      # client-docs is private: no URL may be persisted, the file_path column
      # must exist, and the page must offer a way back out. No browser needed.
      - name: Run documents storage tests
        run: node tests/documents-storage.test.cjs
      # The approval email is built from anonymous input and carries the
      # Approve link. Escape at the template, not only at ingestion.
      - name: Run booking email escaping tests
        run: node tests/booking-email-escaping.test.cjs
      # An FDA co-signature and an inspector-access grant must name an
      # account the system can identify. No browser needed.
      - name: Run compliance attribution tests
        run: node tests/compliance-attribution.test.cjs
      # Two top-level declarations of one name: the last silently wins.
      # A precondition for the GL-037 extraction. No browser needed.
      - name: Run duplicate-declaration tests
        run: node tests/duplicate-declarations.test.cjs
      # The core script was extracted from index.html; it must still load in
      # the same position, classic and blocking. No browser needed.
      - name: Run index script-order tests
        run: node tests/index-script-order.test.cjs
      # CSP directives, and the measured reason unsafe-inline is still needed.
      - name: Run CSP tests
        run: node tests/csp.test.cjs
      # The GL-DEF-01 ratchet: inline handlers may only go down, never up.
      - name: Run inline-handler budget
        run: node tests/inline-handler-budget.test.cjs
      # The weekly review gate must never pass without actually reviewing.
      - name: Run AI review gate tests
        run: node tests/ai-review.test.cjs

      - name: Run smoke test
        env:
          # Let `require('playwright')` in the .cjs resolve from the temp install.
          NODE_PATH: /tmp/pw/node_modules
          # Unset PW_CHROMIUM in CI so Playwright uses the browser it installed.
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/smoke.test.cjs

      # The wider sweep: every page, every modal opener, the invoice flow, and
      # the correspondence / nudge / AI-style logic. Runs after the smoke test so
      # a failure here is clearly the broad net, not a critical path.
      - name: Run full sweep
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/full-sweep.cjs

      # Public onboarding page (onboard.html) — token gating, prefill, submit.
      - name: Run onboarding page test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/onboard-page.test.cjs

      # Daily GMP module — type-once fan-out to multiple registers.
      - name: Run GMP module test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/gmp.test.cjs

      # PRP registers — prerequisite programs open their own single-form entry.
      - name: Run GMP PRP test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/gmp-prp.test.cjs

      # Artwork / SKU manager — multi-SKU upload for staff + customer portal.
      - name: Run artwork test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/artwork.test.cjs

      # Client detail — shared info block shows every field + doc view links.
      - name: Run client detail test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/client-detail.test.cjs

      # Auditor portal (auditor.html) — token gating + read-only dashboard.
      - name: Run auditor page test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/auditor-page.test.cjs

      # GMP documents library — hub tile + auditor dashboard document links.
      - name: Run GMP documents test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/gmp-documents.test.cjs

      # Approved-supplier program + NCR/CAPA — supplier approval fields, defect
      # modal CAPA fields, and NCR raised from a GMP deviation.
      - name: Run SQF supplier/NCR test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/sqf-supplier-ncr.test.cjs

      # Phase 3 Wave 1 — GMP scheduled-task generation + traceability/mock-recall.
      - name: Run Phase 3 Wave 1 test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/phase3-wave1.test.cjs

      # Phase 3 Wave 2 — training records + internal audit/findings/mgmt review.
      - name: Run Phase 3 Wave 2 test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/phase3-wave2.test.cjs

      # The delegated action dispatcher (GL-DEF-01 phase 1). Needs a browser:
      # source assertions cannot prove a delegated listener actually fires.
      - name: Run action dispatcher test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/actions-dispatcher.test.cjs

      # Formulation block on Pipeline + Clients — the three columns must reach
      # the server, and a lead on both a deal and a client counts once.
      - name: Run formulation test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/formulation.test.cjs

      # Per-record Edit on Training & Competency — guards the id interpolated
      # into onclick="…", whose quotes once closed the attribute.
      - name: Run training edit test
        env:
          NODE_PATH: /tmp/pw/node_modules
          REPO_ROOT: ${{ github.workspace }}
        run: node tests/training-edit.test.cjs
