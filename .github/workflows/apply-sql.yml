# Apply a committed migration file to production via the Supabase Management
# API. Exists because the assistant's sandbox cannot reach *.supabase.co and
# the MCP database connection is intermittent — GitHub runners can, and the
# repo already holds a SUPABASE_ACCESS_TOKEN for deploys.
#
# Guard rails: only files under supabase/migrations/ are accepted, so
# everything that runs through this is committed, reviewed SQL — no ad-hoc
# statements.

name: Apply SQL file

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Committed .sql file under supabase/migrations/'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ufjkeqmxwuyhbqyugcgg
    steps:
      - uses: actions/checkout@v4

      - name: Run the SQL via the Management API
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in
            supabase/migrations/*.sql) ;;
            *) echo "refusing: only files under supabase/migrations/ are allowed"; exit 1 ;;
          esac
          test -f "$FILE" || { echo "no such file: $FILE"; exit 1; }
          jq -Rs '{query: .}' < "$FILE" > payload.json
          # Capture body AND status separately so a 400 shows Postgres's actual
          # error message instead of curl's opaque "returned error: 400".
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          echo "HTTP $code"
          echo "--- response ---"
          cat resp.txt
          echo
          if [ "$code" -ge 400 ]; then echo "FAILED: $FILE"; exit 1; fi
          echo "applied: $FILE"
