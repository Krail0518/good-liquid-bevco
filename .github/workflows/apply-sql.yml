# Apply a MERGED migration file to production via the Supabase Management API.
# Exists because the assistant's sandbox cannot reach *.supabase.co and the MCP
# database connection is intermittent — GitHub runners can, and the repo already
# holds a SUPABASE_ACCESS_TOKEN for deploys.
#
# WHAT THIS RUNS WITH
# -------------------
# SUPABASE_ACCESS_TOKEN against the Management API's /database/query endpoint.
# That is unrestricted SQL on the production database — DDL, DML, grants, RLS
# policy changes, DROP. Treat every change to this file as a security change.
#
# WHY THE GUARD LOOKS LIKE THIS
# -----------------------------
# The previous version checked only that the input path started with
# supabase/migrations/ and that the file existed, then ran it. Its header
# claimed that meant "committed, reviewed SQL". It did not:
#
#   * `actions/checkout` with no `ref` checks out the ref the workflow was
#     DISPATCHED on, and workflow_dispatch lets the operator pick any branch.
#   * "the file exists on that branch" is not "the file was reviewed and
#     merged". Anyone able to dispatch could push a branch containing
#     supabase/migrations/anything.sql and have it executed against
#     production, bypassing PR review entirely.
#
# Two changes close that:
#
#   1. `ref: main` — the file is always read from main, never from the
#      dispatch ref, so unmerged SQL cannot be executed.
#   2. A refusal unless the workflow was dispatched on main, so the run is
#      unambiguous in the Actions log.
#
# HONEST LIMIT — read before relying on this
# ------------------------------------------
# For workflow_dispatch, GitHub reads the workflow DEFINITION from the selected
# ref. Someone with push access can therefore push a branch with these guards
# removed and dispatch that. No in-file check can prevent this.
#
# The controls that actually bound the blast radius live outside this file:
#   * who holds write access to the repository
#   * branch protection on main
#   * required reviewers on the `production-db` environment referenced below
#
# The environment gate is the important one. If `production-db` has no required
# reviewers configured, it is decorative. Configure it under
# Settings → Environments → production-db → Required reviewers.

name: Apply SQL file

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'MERGED .sql file under supabase/migrations/ (read from main)'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Gate on a protected environment so a human approves before any SQL runs.
    # Add required reviewers to this environment or it provides no protection.
    environment: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ufjkeqmxwuyhbqyugcgg
    steps:
      - name: Refuse unless dispatched on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing: dispatched on $GITHUB_REF, not refs/heads/main."
            echo "Merge the migration first, then dispatch this workflow on main."
            exit 1
          fi

      # ref: main is the load-bearing line. Without it the checkout follows the
      # dispatch ref and unmerged SQL becomes executable.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run the SQL via the Management API
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in
            supabase/migrations/*.sql) ;;
            *) echo "refusing: only files under supabase/migrations/ are allowed"; exit 1 ;;
          esac
          # Reject traversal before touching the filesystem: the case pattern
          # above still matches supabase/migrations/../../evil.sql.
          case "$FILE" in
            *..*) echo "refusing: path traversal in \"$FILE\""; exit 1 ;;
          esac
          test -f "$FILE" || {
            echo "no such file on main: $FILE"
            echo "If you just opened a PR, the migration is not merged yet."
            exit 1
          }

          echo "About to run against project $PROJECT_REF, from main:"
          echo "  $FILE  ($(wc -l < "$FILE") lines)"
          echo "--- SQL ---"
          cat "$FILE"
          echo "--- end SQL ---"

          jq -Rs '{query: .}' < "$FILE" > payload.json
          # Capture body AND status separately so a 400 shows Postgres's actual
          # error message instead of curl's opaque "returned error: 400".
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          echo "HTTP $code"
          echo "--- response ---"
          cat resp.txt
          echo
          if [ "$code" -ge 400 ]; then echo "FAILED: $FILE"; exit 1; fi
          echo "applied: $FILE"
