name: Auth hardening

# One-shot maintenance job: applies Supabase Auth settings that are not
# expressible as SQL migrations, using the same SUPABASE_ACCESS_TOKEN
# secret the deploy workflow already uses.
#
# Currently enables leaked-password protection (checks new passwords
# against HaveIBeenPwned), flagged by the security advisor on 2026-08-06.
# Safe to re-run: the API call is idempotent.

on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ufjkeqmxwuyhbqyugcgg
    steps:
      - name: Enable leaked-password protection
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"password_hibp_enabled": true}')
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Confirm the setting stuck
        run: |
          set -euo pipefail
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            | grep -o '"password_hibp_enabled":[^,]*'
